[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paywatch"
version = "0.1.0"
description = "Recall-aware transaction triage with a hand-built LSTM"
requires-python = ">=3.11,<3.13"
dependencies = [
 "numpy==1.26.4", "pandas==2.2.3", "onnxruntime==1.20.1",
 "fastapi==0.115.8", "uvicorn==0.34.0", "pydantic==2.10.6",
 "SQLAlchemy==2.0.38", "asyncpg==0.30.0", "aiokafka==0.12.0",
 "prometheus-client==0.21.1"
]

[project.optional-dependencies]
train = ["torch==2.5.1", "scikit-learn==1.6.1", "xgboost==2.1.4",
 "onnx==1.17.0", "protobuf==5.29.3", "onnxconverter-common==1.16.0", "onnxmltools==1.13.0", "skl2onnx==1.18.0", "matplotlib==3.10.0"]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "httpx==0.28.1", "ruff==0.9.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL", "stack: requires running Compose stack"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
